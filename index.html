<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>Study Gym</b><span class="label" id="ver"></span></div>
  </div>
</header>
<main id="main">
  <div class="stack"><h2>Pick a class</h2></div>
  <div class="grid2" id="classes"></div>
</main>
<script src="app/version.js"></script>
<script src="classes/index.js"></script>
<script>
document.getElementById('classes').innerHTML = window.CLASSES.map(function (c) {
  return '<a class="panel stack class-card" href="app.html?c=' + encodeURIComponent(c.id) + '"><h3>' + c.title + '</h3>' +
    (c.subtitle ? '<p class="muted small">' + c.subtitle + '</p>' : '') + '</a>';
}).join('');
document.getElementById('ver').textContent = window.gymVersionText();
document.getElementById('main').insertAdjacentHTML('beforeend', '<details class="chk" style="margin-top:24px"><summary>What\'s new</summary><ul class="tight">' +
  window.GYM_CHANGES.map(function (c, i) { return '<li><span class="mono small">v' + (window.GYM_VERSION - i) + ' · ' + c[0] + '</span> ' + c[1] + '</li>'; }).join('') + '</ul></details>');
</script>
</body>
</html>
